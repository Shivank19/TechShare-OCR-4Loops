<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OCR Todo Capture – Camera & Image → Tasks</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>

<body>
<div class="app">

  <!-- PAGE: CAPTURE -->
  <div id="pageCapture">

    <header class="app-header">
      <h1>OCR Todo Capture</h1>
      <p>Capture or upload a handwritten/printed list → convert lines to tasks.</p>

      <!-- MODES -->
      <div class="pill-row">
        <button id="modeFast" class="active">⚡ Fast</button>
        <button id="modeAccurate">🎯 Accurate</button>
      </div>
      <div id="modeStatus" class="mode-status-badge">⚡ Fast mode enabled</div>

      <!-- LANGUAGE -->
      <div class="lang-row">
        <label>OCR Language:</label>
        <select id="langSelect">
          <option value="eng">English</option>
          <option value="hin">Hindi</option>
          <option value="spa">Spanish</option>
          <option value="fra">French</option>
          <option value="deu">German</option>
          <option value="ita">Italian</option>
          <option value="por">Portuguese</option>
        </select>
      </div>
    </header>

    <!-- CAMERA + UPLOAD -->
    <h2 class="section-title">1. Provide Your To-Do List</h2>

    <section class="card">
      <div class="layout">

        <!-- CAMERA -->
        <div class="card-half">
          <h3>Camera Capture</h3>
          <div class="camera-container">
            <video id="video" autoplay playsinline></video>
            <div class="button-row">
              <button class="btn btn-outline" id="btnStartStopCamera">Start Camera</button>
              <button class="btn btn-primary" id="btnCaptureOCR">Capture</button>
              <button class="btn btn-primary" id="btnExtractCamera">Extract</button>
            </div>
            <p id="cameraStatus" class="status-text"></p>
          </div>
        </div>

        <!-- UPLOAD -->
        <div class="card-half">
          <h3>Upload Image</h3>
          <input type="file" id="imageUpload" accept="image/*" class="file-input">
          <button class="btn btn-primary" id="btnUploadOCR">Extract Uploaded Image</button>
          <p id="uploadStatus" class="status-text"></p>
        </div>

      </div>
    </section>

      <div id="ocrStatus" class="ocr-status">Ready</div>

    <!-- PREVIEW -->
    <section class="card preview-card">
      <h3>Preview</h3>
      <img id="preview" class="preview-img" style="display:none;">
    </section>


    <!-- SECTION 2: OCR TEXT + JSON -->
    <h2 class="section-title">2. OCR Text & JSON</h2>

    <section class="card section-two">
      <div class="side-by-side">

        <!-- RAW OCR -->
        <div class="half-block">
          <h3>Raw OCR Text</h3>
          <textarea id="rawText" class="large-textarea"></textarea>
          <p id="status" class="status-text"></p>
        </div>

        <!-- JSON -->
        <div class="half-block">
          <h3>JSON</h3>
          <textarea id="jsonOutput" class="large-textarea"></textarea>

          <div class="json-btn-container">
            <button class="btn btn-outline" id="btnReparseJson">Rebuild Cards</button>
          </div>
        </div>

      </div>
    </section>

    <!-- TASK SECTION -->
    <h2 class="section-title">3. Edit & Accept Tasks</h2>

    <div class="todo-navigation">
      <button class="btn btn-accent" id="btnGoToTodo">Go to Todo List →</button>
    </div>

    <section class="card">
      <div id="draftContainer" class="todo-draft-grid"></div>
      <div class="nav-buttons">
        <button class="btn btn-ghost" id="btnClearDrafts">Clear Drafts</button>
      </div>
    </section>

  </div>

  <!-- TODO PAGE -->
  <div id="pageTodo" style="display:none;">
    <header class="app-header">
      <div class="page-title-row">
        <h2>My Todo List</h2>
        <button class="btn btn-outline" id="btnBackToCapture">← Back</button>
      </div>
    </header>

    <section class="card card-sm todo-list-container">
      <div id="todoList" class="todo-list"></div>
    </section>
  </div>

</div>

<!-- FEEDBACK TOAST -->
<div id="toast" class="toast">Task added to your Todo List ✔</div>

<script src="script.js"></script>
</body>
</html>
